name: PHP Workflow

on:
  push:
    branches:
      - main  # Trigger on push to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull request to the main branch

jobs:
  test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      - name: Check out the repository
        uses: actions/checkout@v2  # Checkout the repository

      - name: Set up PHP
        uses: shivammathur/setup-php@v2  # Set up PHP using the setup-php action
        with:
          php-version: '8.0'  # Use PHP version 8.0, you can change this to the version you need
          extensions: mbstring, zip  # Install required PHP extensions (optional)

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer  # Install Composer

      - name: Install dependencies
        run: composer install  # Install PHP dependencies from composer.json

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit  # Run PHPUnit tests if you have tests set up in your project